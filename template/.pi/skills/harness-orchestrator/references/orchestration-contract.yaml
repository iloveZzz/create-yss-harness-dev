schema_version: 1
contract_id: harness-agent-contract-v1
status: active
owner: role.harness-orchestrator
target_scope: ddd-tactical-design-to-product-delivery
orchestrator: role.harness-orchestrator
roles:
  - role.architecture-agent
  - role.frontend-agent
  - role.backend-agent
  - role.test-agent
states: [draft, ready-for-review, approved, ready-for-agent, in-progress, verification, verified, completed, blocked, stale, drift, new_impacts]
execution_states: [Explorer, Drafter, Worker, Reviewer, Verifier]
entry:
  required: [yss-project.yaml, CONTEXT.md, approved-upstream-inputs]
  rejected: [missing-context, invalid-repository-mode, stale-upstream-input]
tactical_design:
  required_for_impacts: [domain_behavior, aggregate, invariant, state_machine, consistency, domain_event, gateway_boundary, persistence_mapping]
  no_impact: not-applicable-with-reason
  owner: role.architecture-agent
  review_by: role.test-agent
slice_contract:
  id: slice-implementation-contract-v1
  one_contract_per_slice: true
  shared_version_required: true
  required_sections: [architecture, frontend, backend, testing]
work_unit_routes:
  work-unit.harness-entry:
    primary_skill: harness-orchestrator
    supporting_skills: [implementation-repo-onboarding, research]
    skills: [harness-orchestrator, implementation-repo-onboarding, research]
    applies_when: harness_entry
    not_applicable_reason: harness_context_already_verified
  work-unit.tactical-design:
    primary_skill: architecture-agent
    supporting_skills: [yss-tactical-design, domain-modeling, codebase-design, research, tdd]
    skills: [architecture-agent, yss-tactical-design, domain-modeling, codebase-design, research, tdd]
    applies_when: domain_behavior_or_tactical_design_impact
    not_applicable_reason: no_domain_behavior_or_tactical_design_impact
  work-unit.slice-contract:
    primary_skill: harness-orchestrator
    supporting_skills: [architecture-agent, yss-router, implementation-repo-onboarding]
    skills: [harness-orchestrator, architecture-agent, yss-router, implementation-repo-onboarding]
    applies_when: approved_tactical_design_and_frozen_contracts
    not_applicable_reason: required_upstream_contract_not_current
  work-unit.slice-implementation:
    primary_skill: backend-agent
    supporting_skills: [frontend-agent, test-agent, yss-router, tdd]
    skills: [backend-agent, frontend-agent, test-agent, yss-router, tdd]
    applies_when: slice_contract_ready_for_agent
    not_applicable_reason: slice_contract_not_approved
  work-unit.verification:
    primary_skill: test-agent
    supporting_skills: [code-review, diagnosing-bugs, tdd]
    skills: [test-agent, code-review, diagnosing-bugs, tdd]
    applies_when: implementation_candidate_ready_for_verification
    not_applicable_reason: implementation_not_complete
  work-unit.ssot-update:
    primary_skill: maintaining-skills
    supporting_skills: [codebase-design]
    skills: [maintaining-skills, codebase-design]
    applies_when: template_authority_changes
    not_applicable_reason: no_template_authority_change
  work-unit.skill-projection-sync:
    primary_skill: maintaining-skills
    supporting_skills: []
    skills: [maintaining-skills]
    applies_when: canonical_skill_changes
    not_applicable_reason: no_skill_change
  work-unit.intensity-aware-verification:
    primary_skill: maintaining-skills
    supporting_skills: [tdd]
    skills: [maintaining-skills, tdd]
    applies_when: template_maintenance_verification
    not_applicable_reason: no_template_maintenance
  work-unit.intensity-aware-review:
    primary_skill: code-review
    supporting_skills: [maintaining-skills]
    skills: [code-review, maintaining-skills]
    applies_when: template_maintenance_review
    not_applicable_reason: no_template_maintenance
  work-unit.release-and-rollback:
    primary_skill: maintaining-skills
    supporting_skills: [handoff]
    skills: [maintaining-skills, handoff]
    applies_when: template_checkpoint_required
    not_applicable_reason: no_checkpoint_required
readiness:
  all_of:
    - upstream_inputs_current_and_approved
    - tactical_design_current_or_not_applicable_recorded
    - api_freeze_or_no_api_impact_recorded
    - data_architecture_or_no_data_impact_recorded
    - ui_inputs_or_no_ui_impact_recorded
    - implementation_repositories_and_commands_registered
    - allowed_write_paths_registered
    - test_seams_and_acceptance_executable
    - task_packages_share_contract_version
    - no_blocking_signals
parallelism:
  test_seam_before_implementation: true
  frontend_backend_parallel_after_contract: true
  verifier_must_differ_from_worker: true
gates:
  architecture: [gate.tactical-design-approved, gate.slice-contract-approved]
  implementation: [gate.slice-ready-for-agent]
  verification: [gate.fresh-verification-passed]
  human: [gate.high-risk-architecture-confirmed, gate.openapi-freeze-confirmed, gate.merge-approved]
re_route_on: [api-schema-impact, database-schema-impact, state-machine-impact, aggregate-impact, invariant-impact, new-write-path, new-repository, contract-violation, test-seam-changed, verification-command-changed]
