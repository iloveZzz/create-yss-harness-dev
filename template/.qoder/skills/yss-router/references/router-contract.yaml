schema_version: 1
contract_id: harness-agent-router-v1
allowed_statuses: [draft, blocked, ready-for-lifecycle-review]
forbidden_statuses: [approved, ready-for-agent, completed]
implementation_path_policy: git-submodule-harness-apps
skill_aliases:
  api-integration: yss-api-integration
  microapp-commit: yss-microapp-commit
  page-module-development: yss-page-module-development
  yss-ui-business-page-generation: yss-page-module-development
  use-table-height: yss-use-table-height
  use-tree-height: yss-use-tree-height
execution_states: [Explorer, Drafter, Worker, Reviewer, Verifier]
roles:
  architecture: role.architecture-agent
  frontend: role.frontend-agent
  backend: role.backend-agent
  testing: role.test-agent
  orchestrator: role.harness-orchestrator
readiness_formula:
  all_of:
    - upstream_inputs_current_and_approved
    - tactical_design_current_or_not_applicable_recorded
    - api_freeze_or_no_api_impact_recorded
    - data_architecture_or_no_data_impact_recorded
    - ui_inputs_or_no_ui_impact_recorded
    - implementation_repositories_and_commands_registered
    - allowed_write_paths_registered
    - test_seams_and_acceptance_executable
    - task_packages_share_contract_version
    - no_blocking_signals
slice_contract_required:
  root: [schema_version, contract_id, contract_version, slice_id, status, lifecycle_refs, readiness, common, architecture, frontend, backend, testing, contract, cross_repo, work_units]
  common: [impacted_areas, implementation_path_policy, project_roots, required_skills, optional_skills, unavailable_skills, allowed_write_paths, forbidden_patterns, expected_evidence_files, verification_commands, human_review_points, full_reroute_triggers]
  architecture: [tactical_design_ref, tactical_design_version, aggregate_refs, invariant_refs, state_behavior_refs, gateway_boundary_ref, decision_refs]
  frontend: [status, required_skills, approved_interaction_ref, state_matrix_ref, generated_api_client_ref, allowed_write_paths, component_test_seams, e2e_paths]
  backend: [status, affected_layers, component_impacts, required_skills, application_boundary, transaction_boundary, persistence_strategy, allowed_write_paths, forbidden_patterns, expected_evidence_files, verification_commands]
  testing: [status, required_skills, test_strategy_ref, test_seams, fixtures, coverage_targets, critical_flows, verification_commands]
  contract: [api_impact, freeze_ref, no_api_impact_ref, generated_clients, contract_tests, regeneration_commands]
  cross_repo: [repositories, delivery_order, integration_verification, rollback_order]
work_unit_routes:
  work-unit.harness-entry:
    primary_skill: harness-orchestrator
    supporting_skills: [implementation-repo-onboarding, research]
    skills: [harness-orchestrator, implementation-repo-onboarding, research]
    applies_when: harness_entry
    not_applicable_reason: harness_context_already_verified
  work-unit.tactical-design:
    primary_skill: architecture-agent
    supporting_skills: [yss-tactical-design, domain-modeling, codebase-design, research, tdd]
    skills: [architecture-agent, yss-tactical-design, domain-modeling, codebase-design, research, tdd]
    applies_when: domain_behavior_or_tactical_design_impact
    not_applicable_reason: no_domain_behavior_or_tactical_design_impact
  work-unit.slice-contract:
    primary_skill: harness-orchestrator
    supporting_skills: [architecture-agent, yss-router, implementation-repo-onboarding, cross-repo-implementation-routing]
    skills: [harness-orchestrator, architecture-agent, yss-router, implementation-repo-onboarding, cross-repo-implementation-routing]
    applies_when: approved_tactical_design_and_frozen_contracts
    not_applicable_reason: required_upstream_contract_not_current
  work-unit.slice-implementation:
    primary_skill: backend-agent
    supporting_skills: [frontend-agent, test-agent, yss-router, tdd]
    skills: [backend-agent, frontend-agent, test-agent, yss-router, tdd]
    applies_when: slice_contract_ready_for_agent
    not_applicable_reason: slice_contract_not_approved
  work-unit.verification:
    primary_skill: test-agent
    supporting_skills: [code-review, diagnosing-bugs, tdd]
    skills: [test-agent, code-review, diagnosing-bugs, tdd]
    applies_when: implementation_candidate_ready_for_verification
    not_applicable_reason: implementation_not_complete
  work-unit.ssot-update:
    primary_skill: maintaining-skills
    supporting_skills: [codebase-design]
    skills: [maintaining-skills, codebase-design]
    applies_when: template_authority_changes
    not_applicable_reason: no_template_authority_change
  work-unit.skill-projection-sync:
    primary_skill: maintaining-skills
    supporting_skills: []
    skills: [maintaining-skills]
    applies_when: canonical_skill_changes
    not_applicable_reason: no_skill_change
  work-unit.intensity-aware-verification:
    primary_skill: maintaining-skills
    supporting_skills: [tdd]
    skills: [maintaining-skills, tdd]
    applies_when: template_maintenance_verification
    not_applicable_reason: no_template_maintenance
  work-unit.intensity-aware-review:
    primary_skill: code-review
    supporting_skills: [maintaining-skills]
    skills: [code-review, maintaining-skills]
    applies_when: template_maintenance_review
    not_applicable_reason: no_template_maintenance
  work-unit.release-and-rollback:
    primary_skill: maintaining-skills
    supporting_skills: [handoff]
    skills: [maintaining-skills, handoff]
    applies_when: template_checkpoint_required
    not_applicable_reason: no_checkpoint_required
dependency_closure:
  architecture-agent:
    always: [yss-tactical-design, domain-modeling]
  backend-agent:
    always: [yss-domain, yss-application, yss-repository, yss-web-controller, yss-dto, tdd]
  frontend-agent:
    always: [yss-ui, yss-components, yss-api-integration, tdd]
  test-agent:
    always: [tdd, code-review]
  yss-ddd-scaffold-generator:
    always: [yss-backend-scaffold-parent, alibaba-java-code-style]
  yss-domain:
    always: [alibaba-java-code-style]
    when_modeling: [domain-modeling, yss-tactical-design]
    when_pojo: [lombok]
  yss-application:
    always: [alibaba-java-code-style]
    when_conversion: [mapstruct, lombok]
  yss-repository:
    always: [yss-mybatis, mapstruct, lombok, alibaba-java-code-style]
  yss-web-controller:
    always: [yss-dto, yss-validation, mapstruct, lombok, alibaba-java-code-style]
    when_error_mapping: [yss-exception]
  yss-validation:
    always: [yss-exception]
  yss-exception:
    always: [yss-dto]
component_impact_values: [current-user-context, user-cache-lookup, audit-event, request-validation, error-mapping, encryption-or-signing]
end_to_end_backend_required:
  - yss-domain
  - yss-application
  - yss-repository
  - yss-mybatis
  - yss-web-controller
  - yss-dto
  - yss-exception
  - yss-validation
  - mapstruct
  - lombok
  - alibaba-java-code-style
full_reroute_triggers: [api-schema-impact, database-schema-impact, state-machine-impact, aggregate-impact, invariant-impact, new-write-path, new-repository, contract-violation, test-seam-changed, verification-command-changed, architecture-drift]
tdd_modes:
  behavior-tdd:
    impacts: [domain-rule, state-machine, transaction, complex-query, error-mapping, page-interaction, user-visible-state]
  controlled-generation:
    impacts: [project-scaffold, dto-boilerplate, frozen-openapi-client, mechanical-config]
    required: [exception_reason, generator, generator_inputs, expected_files, verification_commands, behavior_tests_after_generation]

scaffold_contract_schema:
  schema_version: 2
  identity: service-engineering-baseline
  compiled_by: yss-router
  approved_by: harness-orchestrator
  status_by_owner:
    router: [draft, ready-for-lifecycle-review, blocked]
    orchestrator: [approved, stale, blocked]
  required: [contract_id, contract_version, scaffold_request_id, status, router_draft_ref, lifecycle_approval_ref, persisted_ref, current_version, implementation_repository, backend_repository, scaffold_status, project_name, target_output_dir, base_package, maven_coordinates, profiles, allowed_write_paths, expected_evidence_files, verification_commands, approval, work_unit, generation_policy]
  approval:
    required: [approval_ref, approver, persisted_ref, current_version]
  generation_policy:
    required: [mode, existing_target, old_project_migration, template_upgrade]
    mode: initialize-only
    existing_target: unsupported
    old_project_migration: unsupported
    template_upgrade: unsupported
  maven_coordinates:
    required: [group_id, project_version, parent, yss_components_version]
    parent_required: [group_id, artifact_id, version]
    yss_components_version: 2.0.0-SNAPSHOT
  profiles:
    required: [architecture, persistence, database, platform, validation_namespace, dto_placement, repository]
    supported_initial:
      architecture: target-domain-model
      persistence: mybatis-plus
      database: mysql
      platform: spring-boot-2.7-jdk8
      validation_namespace: javax
      dto_placement: web
      repository: yss-internal
    unsupported: [old-architecture-profile, client-in-domain, mybatis, spring-boot-3, jakarta, separate-client-module]
  unsupported_inputs:
    schema_v1: reject-no-auto-upgrade
    slice_id: forbidden-as-scaffold-identity
    existing_project: reject-no-scaffold-migration
  lifecycle_boundary:
    router_emits: [draft, ready-for-lifecycle-review, blocked]
    orchestrator_approves: [approved]
    generator_consumes: [approved]
    after_generation: [yss-backend-scaffold-parent, yss-router-business-contract-recompile]
  work_unit:
    required: [id, behavior, primary_skill, supporting_skills, tdd_mode, allowed_write_paths, expected_evidence, verification_commands, controlled_generation]
  generation_boundary:
    allowed_for: [project_scaffold, pom, mechanical_config, wrapper, bootstrap_entrypoint, manifest_v2, architecture_rules, test_infrastructure]
    forbidden_when: [business_behavior, business_fields, business_state, permission, transaction, complex_query, error_mapping, business_example_crud]
    initialization: initialize-only
    regeneration: unsupported
    template_upgrade: unsupported
    old_project_migration: unsupported-separate-architecture-modernization-initiative
  verification:
    commands: ["./mvnw validate", "./mvnw test", "./mvnw package"]
    requires_execution: true
    completion_levels: [generated, empty-scaffold-verified, first-slice-verified]
    downstream_readiness_claim_requires: first-slice-verified
    completion_requires: [validate_passed, test_passed, package_passed]
    evidence: [preflight, command, exit_code, failure_category, duration_ms, stdout_ref, stderr_ref, executed_at]
    failure_action: blocked
